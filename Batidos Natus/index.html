<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batidos-Natus | Tienda de Batidos Naturales</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .redirect-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7f6 0%, #e8ece9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .redirect-box {
            text-align: center;
            padding: 50px 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
        }
        .redirect-box .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        .redirect-box h1 {
            color: #2c5f2d;
            margin: 0;
            font-size: 1.8rem;
        }
        .redirect-box p {
            color: #666;
            margin: 8px 0 20px 0;
            font-size: 1rem;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e8ece9;
            border-top: 4px solid #2c5f2d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-message {
            color: #888;
            font-size: 0.85rem;
            margin-top: 12px;
        }
        .redirect-message a {
            color: #2c5f2d;
            font-weight: 600;
            text-decoration: none;
        }
        .redirect-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-box">
            <div class="logo-area">
                <img src="img/logo2.png" alt="Batidos-Natus Logo" class="logo-img">
                <div class="logo-text">
                    <h1>Batidos-Natus</h1>
                    <p>Energía natural, sabor auténtico</p>
                </div>
            </div>
            <div class="spinner"></div>
            
            <p style="color: #2c5f2d; font-weight: 600; margin-top: 10px;">
                Redirigiendo al sistema...
            </p>
            
            <div class="redirect-message">
                Si no eres redirigido automáticamente, 
                <a href="login.html">haz clic aquí</a>
            </div>
        </div>
    </div>
    <script>
        window.location.href = 'login.html';
    </script>
</body>
</html>
