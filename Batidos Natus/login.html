<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batidos-Natus | Acceso</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app-container">
        <div class="main-header">
            <div class="logo-area">
                <img src="img/logo2.png" alt="Batidos-Natus Logo" class="logo-img">
                <div class="logo-text">
                    <h1>Batidos-Natus</h1>
                    <p>Energía natural, sabor auténtico</p>
                </div>
            </div>
            <!-- Botón de Administrador ELIMINADO -->
        </div>
        <div class="content-pane">
            <div class="auth-panel">
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="tab-btn active" id="tabLoginBtn">Iniciar Sesión</button>
                        <button class="tab-btn" id="tabRegisterBtn">Registrarse</button>
                    </div>
                    <!-- El formulario se genera dinámicamente desde main.js -->
                    <div id="authFormContainer">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Administrador ELIMINADO -->

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
